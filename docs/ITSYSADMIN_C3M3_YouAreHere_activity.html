<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Server Nobody Sits At</title>
<style>
  :root {
    --bg: #121b24;
    --surface: #18242f;
    --surface-raised: #1f2d3a;
    --line: #2d3d4c;
    --text: #e3e9ef;
    --muted: #a3b2bf;
    --signal-ok: #72d1b2;
    --signal-hold: #e8b65a;
    --focus: #8fc9ff;
    --chosen: #24384a;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 3.5rem;
  }
  h1, h2 {
    font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
    font-weight: 600;
    line-height: 1.25;
    margin: 0;
  }
  h1 { font-size: 1.9rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.3rem; margin-top: 2.5rem; }
  p { margin: 0.75rem 0 0; }

  /* The desk: four pieces of evidence, set as a ledger rather than cards */
  .desk {
    list-style: none;
    margin: 1rem 0 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  .desk li {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 1rem;
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--line);
  }
  .desk .kind { color: var(--muted); font-size: 0.9rem; padding-top: 0.1rem; }

  /* Choices */
  fieldset { border: 0; margin: 1rem 0 0; padding: 0; }
  legend { font-weight: 600; padding: 0; }
  .choice {
    display: grid;
    grid-template-columns: 1.25rem 1fr;
    gap: 0.85rem;
    align-items: start;
    margin-top: 0.75rem;
    padding: 0.9rem 1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
  }
  .choice:hover { border-left-color: var(--muted); }
  .choice input {
    margin: 0.3rem 0 0;
    width: 1.1rem; height: 1.1rem;
    accent-color: var(--signal-ok);
  }
  .choice input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .choice:has(input:checked) { background: var(--chosen); border-left-color: var(--signal-ok); }
  fieldset[disabled] .choice { cursor: default; }
  fieldset[disabled] .choice:not(:has(input:checked)) { opacity: 0.6; }

  .actions { margin-top: 1.25rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--bg);
    background: var(--signal-ok);
    border: 0;
    border-radius: 4px;
    padding: 0.65rem 1.2rem;
    cursor: pointer;
  }
  button.quiet {
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
  }
  button:disabled { background: var(--surface-raised); color: var(--muted); cursor: not-allowed; }
  button:focus-visible, h2:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .hint { color: var(--muted); font-size: 0.95rem; margin-top: 0.6rem; }

  /* Reveal */
  #reveal[hidden] { display: none; }
  .reading {
    margin-top: 1.25rem;
    padding: 1rem 1.1rem 1.1rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
  }
  .reading.is-chosen { border-color: var(--signal-ok); background: var(--chosen); }
  .reading h3 { font-size: 1.05rem; margin: 0; line-height: 1.4; }
  .reading .tag { display: block; color: var(--signal-ok); font-size: 0.9rem; font-weight: 600; margin-bottom: 0.25rem; }
  .split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-top: 0.75rem;
  }
  .split h4 { margin: 0; font-size: 0.95rem; font-weight: 600; }
  .split .settles h4 { color: var(--signal-ok); }
  .split .open h4 { color: var(--signal-hold); }
  .split p { margin-top: 0.3rem; font-size: 0.98rem; }

  .capability {
    margin-top: 2.5rem;
    padding: 1.25rem 0 0;
    border-top: 2px solid var(--signal-hold);
  }
  .capability p:first-of-type {
    font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
    font-size: 1.2rem;
    line-height: 1.5;
    margin-top: 0.5rem;
  }

  @media (prefers-reduced-motion: no-preference) {
    #reveal:not([hidden]) { animation: settle 280ms ease-out; }
    @keyframes settle { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
  @media (max-width: 480px) {
    main { padding: 1.75rem 1rem 2.5rem; }
    h1 { font-size: 1.6rem; }
    .desk li { grid-template-columns: 1fr; gap: 0.15rem; }
    .split { grid-template-columns: 1fr; gap: 0.75rem; }
  }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>

  <section aria-labelledby="situation-h">
    <h2 id="situation-h">The situation</h2>
    <p id="situation"></p>
    <ul class="desk" id="desk" aria-label="What is on your desk"></ul>
  </section>

  <section aria-labelledby="commit-h">
    <h2 id="commit-h">Your call</h2>
    <fieldset id="choices">
      <legend id="question"></legend>
    </fieldset>
    <div class="actions">
      <button type="button" id="commit" disabled>Lock in my choice</button>
    </div>
    <p class="hint" id="commit-hint">Pick one. You'll see what it settles after you lock it in.</p>
  </section>

  <section id="reveal" hidden aria-labelledby="reveal-h">
    <h2 id="reveal-h" tabindex="-1">What each reading settles, and what it leaves open</h2>
    <div id="readings"></div>

    <div class="capability" aria-labelledby="cap-h">
      <h2 id="cap-h" style="margin-top:0">What's missing</h2>
      <p id="capability"></p>
      <p id="capability-close"></p>
    </div>

    <div class="actions">
      <button type="button" class="quiet" id="again">Choose again</button>
    </div>
  </section>

  <p class="visually-hidden" aria-live="polite" id="status" style="position:absolute;left:-9999px;"></p>
</main>

<script>
/* Content block. The skeleton below renders whatever this object holds. */
var CONTENT = {
  title: "The Server Nobody Sits At",
  situation: "A second warehouse has just come onto your company's network. You've been asked to check whether one service has started on the server that came with it. That server is two hours' drive from head office, and nobody there has ever sat in front of it.",
  desk: [
    { kind: "The console", text: "You tried adding this server to your management console. The console couldn't connect to manage it." },
    { kind: "A note", text: "The colleague who built the server says it's up and answering." },
    { kind: "A test", text: "You ping the server from your desk. It answers." },
    { kind: "Experience", text: "The one remote tool you have used is the desktop session the support team uses to reach staff laptops." }
  ],
  question: "What would you do first?",
  options: [
    {
      id: "network",
      label: "Treat it as a network problem. The console can't connect, so ask the network team to check the route between the two sites.",
      settles: "The ping already answered, so the route between the sites works. The server is powered on and the network can reach it.",
      open: "Whether the server can be managed is a separate question about a separate service. The network team will find nothing wrong, and the console will stay empty."
    },
    {
      id: "desktop",
      label: "Open a desktop session to the server, check the service on its screen, and add the server to the console afterwards.",
      settles: "If the session opens, one service on the server is running: the one that shares its screen. You might read today's answer off it.",
      open: "The console relies on a different service. A server can accept a desktop session and refuse every console, so the next request starts from where this one did."
    },
    {
      id: "remote-enable",
      label: "Switch on remote management for the server from your desk, then add it to the console.",
      settles: "This reading suspects the right gap: remote management may not be switched on for that server.",
      open: "The instruction to switch it on would have to travel over the very channel it creates. Sent from your desk, it has nowhere to arrive."
    },
    {
      id: "hold",
      label: "Hold off. The pieces on the desk don't agree, and I'd want to know more before acting.",
      settles: "This reading notices that a server can answer a ping and still refuse the console, and treats that as information.",
      open: "Knowing more needs two specific answers. Which test reaches the service you actually need? And from where could that service be switched on?"
    }
  ],
  capability: "Before you can administer a server from somewhere else, you need two things in place. You need to tell a server you can reach from a server you can manage. And you need to switch on its management channel from a position that does not depend on that channel.",
  capabilityClose: "That is the capability this module builds."
};

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { selected: null, committed: false };

  $("title").textContent = CONTENT.title;
  document.title = CONTENT.title;
  $("situation").textContent = CONTENT.situation;
  $("question").textContent = CONTENT.question;
  $("capability").textContent = CONTENT.capability;
  $("capability-close").textContent = CONTENT.capabilityClose;

  CONTENT.desk.forEach(function (item) {
    var li = document.createElement("li");
    var k = document.createElement("span"); k.className = "kind"; k.textContent = item.kind;
    var t = document.createElement("span"); t.textContent = item.text;
    li.appendChild(k); li.appendChild(t);
    $("desk").appendChild(li);
  });

  CONTENT.options.forEach(function (opt) {
    var label = document.createElement("label");
    label.className = "choice";
    var input = document.createElement("input");
    input.type = "radio"; input.name = "reading"; input.value = opt.id; input.id = "opt-" + opt.id;
    var span = document.createElement("span"); span.textContent = opt.label;
    label.appendChild(input); label.appendChild(span);
    input.addEventListener("change", function () {
      if (state.committed) return;
      state.selected = opt.id;
      $("commit").disabled = false;
    });
    $("choices").appendChild(label);
  });

  function readingBlock(opt, chosen) {
    var div = document.createElement("div");
    div.className = "reading" + (chosen ? " is-chosen" : "");
    var h = document.createElement("h3");
    if (chosen) { var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "Your choice"; h.appendChild(tag); }
    h.appendChild(document.createTextNode(opt.label));
    div.appendChild(h);
    var split = document.createElement("div"); split.className = "split";
    [["settles", "What it settles", opt.settles], ["open", "What it leaves open", opt.open]].forEach(function (c) {
      var col = document.createElement("div"); col.className = c[0];
      var h4 = document.createElement("h4"); h4.textContent = c[1];
      var p = document.createElement("p"); p.textContent = c[2];
      col.appendChild(h4); col.appendChild(p); split.appendChild(col);
    });
    div.appendChild(split);
    return div;
  }

  function commit() {
    if (!state.selected || state.committed) return;
    state.committed = true;
    $("choices").disabled = true;
    $("commit").disabled = true;
    $("commit-hint").textContent = "Your choice is locked in.";
    var box = $("readings"); box.innerHTML = "";
    var chosen = CONTENT.options.filter(function (o) { return o.id === state.selected; })[0];
    box.appendChild(readingBlock(chosen, true));
    CONTENT.options.forEach(function (o) { if (o.id !== state.selected) box.appendChild(readingBlock(o, false)); });
    $("reveal").hidden = false;
    $("status").textContent = "Choice locked in. The readings are shown below.";
    $("reveal-h").focus();
  }

  function reset() {
    state.selected = null; state.committed = false;
    $("choices").disabled = false;
    Array.prototype.forEach.call(document.querySelectorAll('input[name="reading"]'), function (i) { i.checked = false; });
    $("commit").disabled = true;
    $("commit-hint").textContent = "Pick one. You'll see what it settles after you lock it in.";
    $("reveal").hidden = true;
    $("readings").innerHTML = "";
    $("status").textContent = "Choices cleared.";
    var first = document.querySelector('input[name="reading"]');
    if (first) first.focus();
  }

  $("commit").addEventListener("click", commit);
  $("again").addEventListener("click", reset);
})();
</script>
</body>
</html>
